name: Flutter CI/CD Pipeline 🛠️🚀

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.29.0
  JAVA_VERSION: '21'
  FIREBASE_PROJECT_ID: learnza

jobs:
  build-and-test:
    name: Run Tests & Analyze 🧪
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Cache Flutter & Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ runner.tool_cache }}/flutter
            .dart_tool
            build
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ─── New: Decode .env for flutter pub get ───────────────────────────────
      - name: Setup .env for tests
        run: |
          echo "${{ secrets.ENV }}" | base64 -d > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()

  deploy:
    name: Build & Release 🚀
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      needs.build-and-test.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' &&
         github.event.action == 'closed' &&
         github.event.pull_request.merged == true) ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Flutter & Java
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup .env 
        run: |
          echo "${{ secrets.ENV }}" | base64 -d > .env

      - name: Install dependencies
        run: |
          flutter pub get

      # ─── New: Setup Android Keystore for signing ────────────────────────────
      - name: Setup Keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=./keystore/upload-keystore.jks
          EOF

      - name: Build Android artifacts
        run: |
          flutter build apk --release --dart-define-from-file=.env
          flutter build appbundle --release --dart-define-from-file=.env

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Deploy to Play Store
        run: |
          gem install fastlane -NV
          fastlane supply \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track internal \
            --json_key_data "${{ secrets.SERVICE_ACCOUNT_JSON }}" \
            --package_name "xyz.deepeshkalura.rovaa.shadanda"

      - name: Determine version
        id: determine_version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find build -name "*release.apk")
          gh release create "v${{ steps.determine_version.outputs.VERSION }}" \
            "$APK" \
            --title "Release v${{ steps.determine_version.outputs.VERSION }}" \
            --notes "Automated release — version ${{ steps.determine_version.outputs.VERSION }}"
