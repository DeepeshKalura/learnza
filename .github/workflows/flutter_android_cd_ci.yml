name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.32.5
  JAVA_VERSION: '21'
  FIREBASE_PROJECT_ID: learnza

jobs:
  build-and-test:
    name: Run Tests & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup .env for tests
        run: |
          echo "${{ secrets.ENV }}" | base64 -d > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()

  deploy:
    name: Build & Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      needs.build-and-test.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' &&
         github.event.action == 'closed' &&
         github.event.pull_request.merged == true) ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Flutter & Java
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup .env 
        run: |
          echo "${{ secrets.ENV }}" | base64 -d > .env

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Setup Keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=./keystore/upload-keystore.jks
          EOF
      
      - name: Determine Version and Generate Changelog
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
              @semantic-release/changelog
              @semantic-release/git
              semantic-release-flutter
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Build Android App Bundle
        if: steps.semantic_release.outputs.new_release_published == 'true'
        run: flutter build appbundle

      - name: Prepare Play Store Release Notes
        if: steps.semantic_release.outputs.new_release_published == 'true'
        run: |
          mkdir -p .releasenotes/en-US
          echo "${{ steps.semantic_release.outputs.new_release_notes }}" | head -c 500 > .releasenotes/en-US/whatsnew

      - name: Deploy to Play Store Internal Track
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: xyz.deepeshkalura.rovaa.shadanda
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: ".releasenotes/"

      - name: Create GitHub Release
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic_release.outputs.new_release_git_tag }}
          name: Release ${{ steps.semantic_release.outputs.new_release_version }}
          body: ${{ steps.semantic_release.outputs.new_release_notes }}
          files: build/app/outputs/bundle/release/app-release.aab
